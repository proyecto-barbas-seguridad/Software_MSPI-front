name: Frontend CI

on:
  pull_request:
    branches: [Develop]
  push:
    branches: [Develop]

permissions:
  contents: read

jobs:
  verify:
    name: HTTPS gateway / Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/contracts/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix tools/contracts --ignore-scripts
      - name: Check generated API contract
        run: npm run contracts:check
      - name: Compile React and check TypeScript
        run: npm run build
      - name: Verify UI and HTTPS gateway
        run: |
          node --check public/api.js
          node --check public/app.js
          npm test
      - name: Build frontend container
        run: docker build -t mspi-front-ci .
